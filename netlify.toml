[build]
  command = "npm run build"
  publish = "dist"  # Vue's default output folder

# Configure headers to ensure sitemap and robots files are served with correct content types
[[headers]]
  for = "/sitemaps/*"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"